x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "60m"
    max-file: "1"

services:
  notify-db:
    image: postgres:16-alpine
    container_name: notify-db
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: "${NOTIFY_DB_PASSWORD:?NOTIFY_DB_PASSWORD is required}"
      POSTGRES_DB: notify
    volumes:
      - notify-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  notify-service:
    image: ghcr.io/calvin-telemagic/notify-service:${VERSION:-latest}
    build:
      context: .
    container_name: notify-service
    logging: *default-logging
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://notify:${NOTIFY_DB_PASSWORD}@notify-db:5432/notify"
    depends_on:
      notify-db:
        condition: service_healthy
    # Internal only: bind to a private address, never a public one. Jasmin
    # must reach it here for delivery receipts (DLR_BASE_URL).
    ports:
      - "${NOTIFY_BIND:-127.0.0.1}:${NOTIFY_PORT:-8010}:8000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Callers in other compose projects on this host join "notify_net" and reach
    # the service as http://notify-service:8000.
    networks:
      - internal
      - notify_net

volumes:
  notify-db:

networks:
  internal:
  notify_net:
    name: notify_net
